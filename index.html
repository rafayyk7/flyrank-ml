<!-- Dynamic Live Feature: Serverless Contact Form -->
    <div class="form-container" id="contact">
      <h2>📬 Get in Touch / Request Technical Sync</h2>
      <p>Send a direct message below. Submissions are dispatched live via FormSubmit serverless gateway.</p>
      
      <form action="https://formsubmit.co/ab.rafay.khan1@gmail.com" method="POST">
        <!-- Anti-spam & redirect configuration -->
        <input type="hidden" name="_subject" value="New Portfolio Inquiry from FlyRank" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="text" name="_honey" style="display:none" />

        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required placeholder="e.g. Alex Miller" />
        </div>

        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" required placeholder="e.g. alex@company.com" />
        </div>

        <div class="form-group">
          <label for="message">Project Inquiry or Message</label>
          <textarea id="message" name="message" rows="4" required placeholder="Let's discuss a technical collaboration..."></textarea>
        </div>

        <button type="submit" class="btn btn-blue" style="width: 100%;">🚀 Send Live Message</button>
      </form>
    </div>
